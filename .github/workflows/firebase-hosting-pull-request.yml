name: Validate reconciled release
on:
  pull_request:
permissions:
  contents: read
jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
      - run: yarn install --frozen-lockfile --non-interactive --no-progress
      - name: Check production baseline and exact change scope
        run: node scripts/releaseHosting.cjs check
      - name: Test release guard and backend
        run: node --test scripts/releaseHosting.test.cjs functions/*.test.js
      - name: Test frontend
        run: yarn test:unit
      - name: Build
        run: yarn build
      # Releases are explicit: node scripts/releaseHosting.cjs deploy.
      # Never let a branch merge replace production outside its guarded release.
